variables:

  # Versions
  NODE_VERSION: "24"
  ALPINE_VERSION: "3.22"
  DOCKER_VERSION: "24.0"
  MYSQL_VERSION: "8"
  MSSQLSERVER_VERSION: "2022"

  # Docker config (para jobs que usan Docker)
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""

  # Server Registry config
  HARBOR_REGISTRY: harbor-utict.patronato.unam.mx
  HARBOR_PROJECT: ${CI_PROJECT_NAME}
  HARBOR_IMAGES_PUBLIC: base-images
  HARBOR_USERNAME: desarrollo
  IMAGE_NAME: be
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  FULL_IMAGE_NAME: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}
  HARBOR_KEEP_TAGS: "3"    # <-- conservar 3 imágenes (incluyendo la actual)
  
  # Usar Harbor como proxy para imágenes públicas
  NODE_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/node:${NODE_VERSION}-alpine
  ALPINE_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/alpine:${ALPINE_VERSION}
  DOCKER_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/docker:${DOCKER_VERSION}
  MYSQL_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/mysql:${MYSQL_VERSION}
  MSSQLSERVER2022_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/mcr.microsoft.com/mssql/server:${MSSQLSERVER_VERSION}-latest
  SFTP_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/atmoz/sftp
  NGINX_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/nginx:alpine

  # Server Deployment config
  SSH_USER_QA: desarrollo
  SSH_HOST_QA: spdocker-desa-24.patronato.unam.mx
  SSH_PORT_QA: "22"
 
  # Server Delivery config
  SSH_HOST_PROD: spdocker-pro.patronato.unam.mx
  SSH_PORT_PROD: "22"

  # SSH options
  SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  REMOTE_PATH: /opt/docker/${HARBOR_PROJECT}-${IMAGE_NAME}

# Al inicio del archivo, agrega workflow global
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_TITLE =~ /^Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /^WIP:/ || $CI_MERGE_REQUEST_LABELS =~ /draft/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop" 
    - if: $CI_MERGE_REQUEST_ID

stages:
  - cache
  - install
  - test
  - build
  - deploy
  - post-deploy
  - delivery
  - logs

# Agregar caché global y políticas
default:
  tags:
    - utict
  image: ${NODE_IMAGE}
  cache:
    key: 
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.clean_shadow_submodules: &clean_shadow_submodules
  - |  # Limpiar submódulos para evitar problemas con cambios en .gitmodules
    for path in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
      echo "Cleaning submodule $path"
      rm -rf "$path"                         # borra la copia de trabajo
      rm -rf ".git/modules/$path"            # borra metadata interna del submódulo
    done
  - | # si alguna submodule quedó shallow:
    git submodule foreach 'git fetch --all || true; git fetch --unshallow || true'
  - git submodule sync --recursive
  - git submodule update --init --recursive

install-dependencies:
  stage: install
  before_script:
    - apk add --no-cache git
    - *clean_shadow_submodules
    - npm config set cache .npm --global
  script:
     - npm ci --no-audit

lint:
  stage: test
  script:
    - npm run lint
  dependencies:
    - install-dependencies
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID

# -------------------------------------------------------------
# Jobs de construcción, despliegue y entrega
# -------------------------------------------------------------
build-app:
  stage: build
  image: ${DOCKER_IMAGE}
  before_script:
    - apk add --no-cache curl jq
    - |    
      if [ -z "$HARBOR_PASSWORD" ]; then
        echo "ERROR: HARBOR_PASSWORD variable is not set"
        exit 1
      fi
    - echo "Checking if Harbor project exists or creating it..."
    - |
      # Check if project exists
      PROJECT_EXISTS=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_PROJECT" | jq -e ".[] | select(.name == \"$HARBOR_PROJECT\")" > /dev/null && echo 1 || echo 0)

      # If project doesn't exist, create it
      if [ "$PROJECT_EXISTS" -eq "0" ]; then
        echo "Creating Harbor project '$HARBOR_PROJECT'..."
        curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X POST "https://$HARBOR_REGISTRY/api/v2.0/projects" \
          -H "Content-Type: application/json" \
          -d "{\"project_name\": \"$HARBOR_PROJECT\", \"public\": false}" \
          -o /dev/null
        
        # Check if project was created successfully
        PROJECT_CREATED=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_PROJECT" | jq -e ".[] | select(.name == \"$HARBOR_PROJECT\")" > /dev/null && echo 1 || echo 0)
        if [ "$PROJECT_CREATED" -eq "0" ]; then
          echo "Failed to create Harbor project '$HARBOR_PROJECT'"
          exit 1
        else
          echo "✓ Harbor project '$HARBOR_PROJECT' created successfully"
        fi
      else
        echo "✓ Harbor project '$HARBOR_PROJECT' already exists"
      fi
  script:
    - echo "Logging into Harbor registry..."
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_REGISTRY
    - echo "Building image ${FULL_IMAGE_NAME}:${IMAGE_TAG}"
    - |
      docker build \
        --build-arg NODE_VERSION=${NODE_VERSION} \
        --build-arg ALPINE_VERSION=${ALPINE_VERSION} \
        --cache-from ${FULL_IMAGE_NAME}:latest \
        -t ${FULL_IMAGE_NAME}:${IMAGE_TAG} \
        -t ${FULL_IMAGE_NAME}:latest \
        .
    - docker push ${FULL_IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${FULL_IMAGE_NAME}:latest
  after_script:
    - |
      # Solo limpiar en caso de éxito del job (evita borrar si falló el push)
      if [ "${CI_JOB_STATUS:-}" = "success" ]; then
        KEEP=${HARBOR_KEEP_TAGS:-3}
        echo "Cleaning Harbor artifacts for ${HARBOR_PROJECT}/${IMAGE_NAME}, keeping ${KEEP} most recent..."
        PAGE=1
        PAGE_SIZE=100
        # Recolectar todos los artifacts con paginado simple
        ARTIFACTS_ALL=""
        while : ; do
          PAGE_JSON=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" "https://$HARBOR_REGISTRY/api/v2.0/projects/$HARBOR_PROJECT/repositories/$IMAGE_NAME/artifacts?page=$PAGE&page_size=$PAGE_SIZE")
          COUNT=$(echo "$PAGE_JSON" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            break
          fi
          ARTIFACTS_ALL="$(printf '%s\n%s' "$ARTIFACTS_ALL" "$PAGE_JSON")"
          if [ "$COUNT" -lt "$PAGE_SIZE" ]; then
            break
          fi
          PAGE=$((PAGE+1))
        done
        TOTAL=$(echo "$ARTIFACTS_ALL" | jq -s 'add | length')
        if [ "$TOTAL" -le "$KEEP" ] || [ "$TOTAL" -eq 0 ]; then
          echo "No artifacts to delete (total=$TOTAL, keep=$KEEP)"
        else
          TO_DELETE_COUNT=$((TOTAL - KEEP))
          echo "Found $TOTAL artifacts, will delete $TO_DELETE_COUNT oldest artifacts"
          echo "$ARTIFACTS_ALL" | jq -s -r 'add | .[] | "\(.push_time) \(.digest)"' | sort | head -n $TO_DELETE_COUNT | awk '{print $2}' | while read -r DIGEST; do
            if [ -n "$DIGEST" ]; then
              echo "Deleting artifact digest: $DIGEST"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X DELETE "https://$HARBOR_REGISTRY/api/v2.0/projects/$HARBOR_PROJECT/repositories/$IMAGE_NAME/artifacts/$DIGEST")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "Deleted $DIGEST (HTTP $HTTP_CODE)"
              else
                echo "Failed to delete $DIGEST (HTTP $HTTP_CODE) — continue"
              fi
            fi
          done
        fi
      else
        echo "Skipping Harbor cleanup because job did not finish successfully (CI_JOB_STATUS=${CI_JOB_STATUS:-})"
      fi
    - docker logout $HARBOR_REGISTRY || true
    - docker system prune -f || true
  artifacts:
    paths:
      - compose.yml
    expire_in: 7 days
  dependencies:
    - e2e-tests
    - lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # NO en merge requests - solo en ramas principales

.check_vars_deploy_template: &check_vars_deploy_template
  - |
    # Verificar variables de entorno requeridas
    if [ -z "$ENV_FILE_QA" ] || [ ! -f "$ENV_FILE_QA" ]; then
      echo "ERROR: ENV_FILE_QA variable is not set or file doesn't exist"
      exit 1
    fi

    if [ -z "$HARBOR_PASSWORD" ]; then
      echo "ERROR: HARBOR_PASSWORD variable is not set"
      exit 1
    fi

    if [ -z "$SSH_PASSWORD_QA" ]; then
      echo "ERROR: SSH_PASSWORD_QA variable is not set"
      exit 1
    fi

deploy-qa:
  stage: deploy
  image: ${ALPINE_IMAGE}
  # <-- Anular cache global para evitar restaurar/archivar node_modules/.npm -->
  cache: []
  variables:
    GIT_STRATEGY: "none"   # evitar intento de clonar el repo (evita 403)
  environment:
    name: qa
    url: http://${HARBOR_PROJECT}-${IMAGE_NAME}.${SSH_HOST_QA}
    on_stop: stop_qa
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    - *check_vars_deploy_template
    - cp "$ENV_FILE_QA" .env
    - echo "✓ .env file created successfully"
    - echo "Creating remote directory structure..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -tt -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA \
        "echo '$SSH_PASSWORD_QA' | mkdir -p $REMOTE_PATH && \
        echo '$SSH_PASSWORD_QA' | chown $SSH_USER_QA:$SSH_USER_QA $REMOTE_PATH"
  script:
    - echo "Deploying to QA environment..."
    - echo "Copying deployment files..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT_QA $SSH_OPTIONS" \
        compose.yml .env $SSH_USER_QA@$SSH_HOST_QA:$REMOTE_PATH/   
    - echo "Executing deployment..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
        cd $REMOTE_PATH &&
        export FULL_IMAGE_NAME='$FULL_IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Logging into Harbor registry...' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        echo 'Deploying image: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        docker compose pull &&
        docker compose up -d --build --remove-orphans &&
        docker compose ps
      "
  dependencies:
    - build-app
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    # NO en merge requests - solo en ramas principales

stop_qa:
  stage: deploy
  image: ${ALPINE_IMAGE}
  # <-- Anular cache global para evitar restaurar/archivar node_modules/.npm -->
  cache: []
  variables:
    GIT_STRATEGY: "none"
  environment:
    name: qa
    action: stop
  needs:
    - job: deploy-qa
      artifacts: false
  before_script:
    - apk add --no-cache openssh-client sshpass
    - *check_vars_deploy_template
  script:
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
        cd $REMOTE_PATH &&
        export FULL_IMAGE_NAME='$FULL_IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Logging into Harbor registry...' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        echo 'Stopping container: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        docker compose down
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    # NO en merge requests - solo en ramas principales
            
.check_vars_delivery_template: &check_vars_delivery_template
  - |
    # Verificar variables de entorno requeridas
    if [ -z "$ENV_FILE_PROD" ] || [ ! -f "$ENV_FILE_PROD" ]; then
      echo "ERROR: ENV_FILE_PROD variable is not set or file doesn't exist"
      exit 1
    fi
    
    if [ -z "$SSH_USER_PROD" ]; then
      echo "ERROR: SSH_USER_PROD variable is not set"
      exit 1
    fi
    
    if [ -z "$SSH_PASSWORD_PROD" ]; then
      echo "ERROR: SSH_PASSWORD_PROD variable is not set"
      exit 1
    fi

delivery-production:
  stage: delivery
  image: ${ALPINE_IMAGE}
  # <-- Anular cache global para evitar restaurar/archivar node_modules/.npm -->
  cache: []
  variables:
    GIT_STRATEGY: "none"   # evitar intento de clonar el repo (evita 403)
  environment:
    name: production
    url: http://${HARBOR_PROJECT}-${IMAGE_NAME}.${SSH_HOST_PROD}
    on_stop: stop_production
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    - *check_vars_delivery_template
    - cp "$ENV_FILE_PROD" .env
    - echo "✓ .env file created successfully"
    - echo "Creating remote directory structure..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -tt -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD \
        "echo '$SSH_PASSWORD_PROD' | mkdir -p $REMOTE_PATH && \
         echo '$SSH_PASSWORD_PROD' | chown $SSH_USER_PROD:$SSH_USER_PROD $REMOTE_PATH"
  script:
    - echo "Delivering to Production environment..."
    - echo "Copying deployment files..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT_PROD $SSH_OPTIONS" \
        compose.yml .env $SSH_USER_PROD@$SSH_HOST_PROD:$REMOTE_PATH/
    - echo "Executing delivery..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export FULL_IMAGE_NAME='$FULL_IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Logging into Harbor registry...' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        echo 'Deploying image: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        docker compose pull &&
        docker compose up -d --build --remove-orphans &&
        docker compose ps
      "
  needs:
    - job: build-app
      artifacts: true
    - job: deploy-qa
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual  # Deploy manual en develop
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Deploy manual en main también
    # NO en merge requests - solo en ramas principales

stop_production:
  stage: delivery
  image: ${ALPINE_IMAGE}
  # <-- Anular cache global para evitar restaurar/archivar node_modules/.npm -->
  cache: []
  variables:
    GIT_STRATEGY: "none"
  environment:
    name: production
    action: stop
  needs:
    - job: delivery-production
      artifacts: false
  before_script:
    - *check_vars_delivery_template
    - apk add --no-cache openssh-client sshpass
  script:
    - echo "Stopping production deployment..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export FULL_IMAGE_NAME='$FULL_IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Logging into Harbor registry...' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        echo 'Stopping container: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        docker compose down
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    # NO en merge requests - solo en ramas principales

.check_vars_for_logs: &check_vars_for_logs
  - |
    # Verficar que tenemos las credenciales para conectarnos a producción
    if [ -z "$SSH_USER_PROD" ]; then
      echo "ERROR: SSH_USER_PROD variable is not set"
      exit 1
    fi
    
    if [ -z "$SSH_PASSWORD_PROD" ]; then
      echo "ERROR: SSH_PASSWORD_PROD variable is not set"
      exit 1
    fi

log-prod-short:
  stage: logs
  image: ${ALPINE_IMAGE}
  cache: []
  variables:
    GIT_STRATEGY: "none"
  needs: []
  before_script:
    - apk add --no-cache openssh-client sshpass
    - *check_vars_for_logs
  script:
    - echo "Fetching logs from production environment..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export FULL_IMAGE_NAME='$FULL_IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo '=== Container Status ===' &&
        docker compose ps &&
        echo '' &&
        echo '=== Last 100 lines of logs ===' &&
        docker compose logs --tail=100
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true

log-prod-full:
  stage: logs
  image: ${ALPINE_IMAGE}
  cache: []
  variables:
    GIT_STRATEGY: "none"
  needs: []
  before_script:
    - apk add --no-cache openssh-client sshpass
    - *check_vars_for_logs
  script:
    - echo "Fetching full logs from production environment..."
    - mkdir -p logs
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export FULL_IMAGE_NAME='$FULL_IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        docker compose logs --no-color
      " > logs/production-${CI_COMMIT_SHORT_SHA}.log
    - echo "Logs saved to artifact"
  artifacts:
    paths:
      - logs/
    expire_in: 1 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true