# ---------------------------------------------
# Job para limpieza de recursos Docker
# ---------------------------------------------
cleanup:docker:
  stage: post-deploy
  image: ${DOCKER_IMAGE}
  cache: []
  variables:
    GIT_STRATEGY: "none"
  needs: []
  parallel:
    matrix:
      - TARGET: ["runner", "server"]
  before_script:
    - |
      if [ "$TARGET" == "server" ]; then
        apk add --no-cache openssh-client sshpass
        [ -z "$SSH_PASSWORD_QA" ] && echo "ERROR: SSH_PASSWORD_QA not set" && exit 1
      fi
  script:
    - |
      if [ "$TARGET" = "runner" ]; then
        echo "🧹 Limpieza LOCAL - estado inicial"
        docker system df || true

        echo -e "\n1) Eliminar contenedores 'exited' y 'dead' (libera volúmenes anonimos)"
        docker ps -a --filter "status=exited" --filter "status=dead" -q | xargs -r docker rm -v || true

        echo -e "\n2) Prune general (containers/images/networks/build cache)"
        docker container prune -f || true
        docker image prune -a -f || true
        docker network prune -f || true
        docker builder prune -a -f || true

        echo -e "\n3) Eliminar volúmenes 'dangling' detectados por Docker"
        docker volume ls -qf dangling=true | xargs -r docker volume rm -f || true

        echo -e "\n4) Intentar eliminar volúmenes no referenciados por contenedores (seguro)"
        docker volume ls -q | while read -r vol; do
          if [ -z "$(docker ps -a --filter "volume=$vol" -q)" ]; then
            echo "  Removing unused volume: $vol"
            docker volume rm -f "$vol" || echo "    ⚠ Could not remove $vol"
          else
            echo "  In use, skipping: $vol"
          fi
        done

        echo -e "\nEstado final:"
        docker system df || true
        echo "✅ Completado"
      else
        echo "🧹 Limpieza REMOTA"
        sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS \
          $SSH_USER_QA@$SSH_HOST_QA \
          "docker system df && \
           docker container prune -f && \
           docker volume prune -f && \
           docker image prune -a -f && \
           docker network prune -f && \
           docker builder prune -a -f && \
           docker volume prune -f && \
           docker system df && \
           echo '✅ Completado'"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
  timeout: 15m