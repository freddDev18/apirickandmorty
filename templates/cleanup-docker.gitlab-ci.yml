# ---------------------------------------------
# Job para limpieza de recursos Docker
# ---------------------------------------------
cleanup:docker:
  stage: post-deploy
  image: ${DOCKER_IMAGE}
  # <-- Anular cache global para evitar restaurar/archivar node_modules/.npm -->
  cache: []
  variables:
    GIT_STRATEGY: "none"   # evitar intento de clonar el repo (evita 403)
  needs:
    - job: deploy-qa
      artifacts: false
  parallel:
    matrix:
      - TARGET: ["runner", "server"]
  before_script:
    - |
      if [ "$TARGET" == "server" ]; then
        apk add --no-cache openssh-client sshpass
        if [ -z "$SSH_PASSWORD_QA" ]; then
          echo "ERROR: SSH_PASSWORD_QA variable is not set"
          exit 1
        fi
      fi
  script:
    - |
      if [ "$TARGET" == "runner" ]; then        
        echo "Cleaning up local Docker resources..."
        echo -e "\n📊 Estado ANTES de la limpieza:"
        docker system df
        docker image prune -a --force
        docker container prune --force
        echo -e "\n🗑️  Eliminando volúmenes huérfanos..."
        VOLUMES_BEFORE=$(docker volume ls -q | wc -l)
        docker volume prune --force || true
        VOLUMES_AFTER=$(docker volume ls -q | wc -l)
        VOLUMES_REMOVED=$((VOLUMES_BEFORE - VOLUMES_AFTER))
        echo "   ✅ Volúmenes eliminados: $VOLUMES_REMOVED"
        docker builder prune -a --force
        docker network prune --force
        echo -e "\n📊 Estado DESPUÉS de la limpieza:"
        docker system df
        echo -e "\n✅ Limpieza local completada"
      else
        echo "Cleaning up remote Docker resources..."
        sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
          echo -e '\n📊 Estado ANTES de la limpieza:' && 
          docker system df &&
          docker image prune -a --force &&
          docker container prune --force &&
          docker volume prune --force &&
          docker builder prune -a --force &&
          docker network prune --force &&|
          echo -e '\n📊 Estado DESPUÉS de la limpieza:' && 
          docker system df
          echo -e '\n✅ Limpieza remota completada'
        "
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    # NO en merge requests - solo en ramas principales
