# ---------------------------------------------
# Job para limpieza de recursos Docker
# ---------------------------------------------
cleanup:docker:
  stage: post-deploy
  image: ${DOCKER_IMAGE}
  cache: []
  variables:
    GIT_STRATEGY: "none"
  needs: []
  parallel:
    matrix:
      - TARGET: ["runner", "server"]
  before_script:
    - |
      if [ "$TARGET" == "server" ]; then
        apk add --no-cache openssh-client sshpass
        [ -z "$SSH_PASSWORD_QA" ] && echo "ERROR: SSH_PASSWORD_QA not set" && exit 1
      fi
  script:
    - |
      if [ "$TARGET" == "runner" ]; then
        echo "🧹 Limpieza LOCAL"
        echo "📊 Antes:"
        docker system df
        
        echo -e "\n🗑️  Limpiando..."
        docker container prune -f
        docker volume prune -f
        docker builder prune -a -f
        docker image prune -a -f
        docker network prune -f
        docker volume prune -f  # Segunda pasada para asegurar limpieza
        # 7. Optional: Remove volumes older than 1 days that aren't in use
        echo "Removiendo volúmenes antiguos (>7 días)..."
        docker volume ls -q | while read vol; do
          if [ -z "$(docker ps -a --filter volume=$vol -q)" ]; then
            CREATED=$(docker volume inspect --format '{{ .CreatedAt }}' "$vol" 2>/dev/null || echo "")
            if [ -n "$CREATED" ]; then
              AGE_SECONDS=$(( $(date +%s) - $(date -d "$CREATED" +%s 2>/dev/null || echo $(date +%s)) ))
              if [ $AGE_SECONDS -gt 86400 ]; then  # 1 days
                echo "Removiendo volumen antiguo: $vol (creado $CREATED)"
                docker volume rm "$vol" 2>/dev/null || true
              fi
            fi
          fi
        done
        
        echo -e "\n📊 Después:"
        docker system df
        echo "✅ Completado"
      else
        echo "🧹 Limpieza REMOTA"
        sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS \
          $SSH_USER_QA@$SSH_HOST_QA \
          "docker system df && \
           docker container prune -f && \
           docker volume prune -f && \
           docker image prune -a -f && \
           docker network prune -f && \
           docker builder prune -a -f && \
           docker volume prune -f && \
           docker system df && \
           echo '✅ Completado'"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
  timeout: 15m