# ---------------------------------------------
# Job para cachear imágenes base en Harbor
# ---------------------------------------------
cache-base-images:
  stage: cache
  image: docker:24.0
  # <-- Anular cache global para evitar restaurar/archivar node_modules/.npm -->
  cache: []
  variables:
    GIT_STRATEGY: "none"   # evitar intento de clonar el repo (evita 403)
    # Lista de imágenes base que usamos en el pipeline
    BASE_IMAGES: |
      node:${NODE_VERSION}-alpine
      alpine:${ALPINE_VERSION}
      docker:${DOCKER_VERSION}
      mysql:${MYSQL_VERSION}
      mcr.microsoft.com/mssql/server:${MSSQLSERVER_VERSION}-latest
      atmoz/sftp
      nginx:alpine
      postgres:12.22
      dockurr/samba
      
  before_script:
    - apk add --no-cache curl jq
    - |
      # Login a Harbor
      if [ ! -z "$HARBOR_USERNAME" ] && [ ! -z "$HARBOR_PASSWORD" ]; then
          echo "Authenticating with Harbor registry..."
          echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_REGISTRY
      elif [ -z "$HARBOR_USERNAME" ] || [ -z "$HARBOR_PASSWORD" ]; then
          echo "WARNING: HARBOR_USERNAME or HARBOR_PASSWORD is not set. Skipping Harbor authentication."
      fi
      
      # Crear proyecto base-images si no existe
      echo "Checking if Harbor cache project exists or creating it..."
      PROJECT_EXISTS=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_IMAGES_PUBLIC" | jq -e ".[] | select(.name == \"$HARBOR_IMAGES_PUBLIC\")" > /dev/null && echo 1 || echo 0)

      if [ "$PROJECT_EXISTS" -eq "0" ]; then
        echo "Creating Harbor cache project '$HARBOR_IMAGES_PUBLIC'..."
        curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X POST "https://$HARBOR_REGISTRY/api/v2.0/projects" \
          -H "Content-Type: application/json" \
          -d "{\"project_name\": \"$HARBOR_IMAGES_PUBLIC\", \"public\": true}" \
          -o /dev/null
        
        PROJECT_CREATED=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_IMAGES_PUBLIC" | jq -e ".[] | select(.name == \"$HARBOR_IMAGES_PUBLIC\")" > /dev/null && echo 1 || echo 0)
        if [ "$PROJECT_CREATED" -eq "0" ]; then
          echo "Failed to create Harbor cache project '$HARBOR_IMAGES_PUBLIC'"
          exit 1
        else
          echo "✓ Harbor cache project '$HARBOR_IMAGES_PUBLIC' created successfully"
        fi
      else
        echo "✓ Harbor cache project '$HARBOR_IMAGES_PUBLIC' already exists"
      fi
  script:
    - |
      echo "Caching base images to Harbor..."
      echo "$BASE_IMAGES" | while IFS= read -r image; do
        # Omitir líneas vacías
        [ -z "$image" ] && continue
        
        echo "Processing image: $image"
        
        # Construir nombres de imagen
        harbor_image="${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/${image}"
        
        # Verificar si la imagen ya existe en Harbor
        echo "Checking if $harbor_image exists in Harbor..."
        if docker manifest inspect "$harbor_image" >/dev/null 2>&1; then
          echo "✓ Image $harbor_image already exists in Harbor, skipping..."
          continue
        fi
        
        # Descargar imagen de Docker Hub
        echo "Pulling $image from Docker Hub..."
        if docker pull "$image"; then
          echo "✓ Successfully pulled $image"
          
          # Etiquetar para Harbor
          echo "Tagging $image as $harbor_image"
          docker tag "$image" "$harbor_image"
          
          # Subir a Harbor
          echo "Pushing $harbor_image to Harbor..."
          if docker push "$harbor_image"; then
            echo "✓ Successfully pushed $harbor_image to Harbor"
          else
            echo "✗ Failed to push $harbor_image to Harbor"
          fi
          
          # Limpiar imagen local para ahorrar espacio
          docker rmi "$image" "$harbor_image" || true
        else
          echo "✗ Failed to pull $image from Docker Hub"
        fi
        
        echo "---"
      done
  after_script:
    - docker logout $HARBOR_REGISTRY || true
    - docker system prune -f || true
  rules:
    - if: $ENABLE_CACHE_IMAGES == "true" && $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $ENABLE_CACHE_IMAGES == "true" && $CI_COMMIT_BRANCH == "develop"  
      when: manual
    - if: $ENABLE_CACHE_IMAGES == "true" && $CI_MERGE_REQUEST_ID
      when: manual
    # - when: never  # ← Oculta completamente si la variable no está definida
  