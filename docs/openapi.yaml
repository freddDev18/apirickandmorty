openapi: 3.0.3
info:
  title: Usuarios API
  description: Ejemplo de contrato sobre usuarios fakers
  contact:
    name: Antonio Obregón
    email: antonio.obregon@utict.unam.mx
  version: 1.0.0
servers:
  - url: http://{servername}:{port}/api/{version}
    description: Servidor de pruebas
    variables:
      servername:
        # note! no enum here means it is an open value
        default: localhost
        description: Nombre del servidor API
      port:
        default: '3000'
      version:
        default: v1
tags:
  - name: users
    description: Operaciones sobre usuarios fakers
  - name: dates
    description: Operaciones sobre fechas y zonas horarias
paths:
  /users:
    get:
      tags:
        - users
      summary: Obtiene una lista de usuarios.
      description: Devuelve una lista de objectos de usuarios disponibles.
      operationId: getUsers
      responses:
        '200':
          $ref: '#/components/responses/Usuarios.response'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
        default:
          $ref: '#/components/responses/Default.response'
    post:
      tags:
        - users
      summary: Crea un nuevo usuario
      description: Agrega un nuevo usuario
      operationId: addUser
      requestBody:
        $ref: '#/components/requestBodies/CrearUsuario'
      responses:
        '201':
          $ref: '#/components/responses/CrearUsuario.response'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /users/findById:
    get:
      tags:
        - users
      summary: Obtiene un usuario por ID.
      description: Devuelve un usuario por ID.
      operationId: findUserById
      parameters:
          - $ref: '#/components/parameters/query.parameter'
      responses:
        '200':
          $ref: '#/components/responses/Usuario.response'
        '404':
          $ref: '#/components/responses/NotFound.response'
        default:
          $ref: '#/components/responses/Default.response'
  /users/{id}:
    get:
      tags:
        - users
      summary: Obtiene un usuario por ID.
      description: Devuelve un usuario por ID.
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/id.parameter'
      responses:
        '200':
          $ref: '#/components/responses/Usuario.response'
        '404':
          $ref: '#/components/responses/NotFound.response'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
        default:
          $ref: '#/components/responses/Default.response'
    patch:
      tags:
        - users
      summary: Actualiza porción o total de un usuario existente
      description: Actualiza una porción o el total de los datos de un usuario existente
      operationId: updateUserById
      parameters:
        - $ref: '#/components/parameters/id.parameter'
      requestBody:
        $ref: '#/components/requestBodies/ActualizarUsuario'
      responses:
        '200':
          $ref: '#/components/responses/ActualizarUsuario.response'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '404':
          $ref: '#/components/responses/NotFound.response'
        '409':
          $ref: '#/components/responses/Conflict.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
    delete:
      tags:
        - users
      summary: Elimina un usuario por ID
      description: Elimina un usuario identificado por un ID
      operationId: deleteUserById
      parameters:
        - $ref: '#/components/parameters/id.parameter'
      responses:
        '200':
          $ref: '#/components/responses/EliminarUsuario.response'
        '404':
          $ref: '#/components/responses/NotFound.response'
        '409':
          $ref: '#/components/responses/Conflict.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /dates:
    post:
      tags:
        - dates
      summary: Crea una nueva fecha
      description: Agrega una nueva fecha
      operationId: addDate
      requestBody:
        $ref: '#/components/requestBodies/CrearFecha'
      responses:
        '201':
          $ref: '#/components/responses/CrearFecha.response'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /character:
    get:
      tags:
        - Personajes
      summary: Obtener lista de personajes
      description: Retorna una lista paginada de todos los personajes de la serie.
      parameters:
        - $ref: '#/components/parameters/page.parameter'
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterPaginatedResponse'
        '404':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /character/{id}:
    get:
      tags:
        - Personajes
      summary: Obtener el detalle de un personaje único
      description: Retorna toda la información de un solo personaje identificado por su ID.
      parameters:
        - $ref: '#/components/parameters/id.parameter'
      responses:
        '200':
          description: Personaje encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /character/{ids}:
    get:
      tags:
        - Personajes
      summary: Obtener una lista de detalles de personajes
      description: Retorna una lista de objetos de informacion
      parameters: 
        - name: ids
          in: path
          description: Lista de IDs de personajes separados por coma (ej. 2,4,6)
          required: true
          schema:
            type: string
            pattern: '^\d+(,\d+)*$'  # <--- MAGIA: Solo acepta "1", "1,2", "1,2,3", etc.
          example: '2,4,6'
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterPaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /location:
    get:
      tags:
        - Ubicaciones
      summary: Obtener lista de ubicaciones
      description: Retorna una lista paginada de todos los planetas, dimensiones y estaciones espaciales.
      parameters:
        - $ref: '#/components/parameters/page.parameter'
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /location/{id}:
    get:
      tags:
        - Ubicaciones
      summary: Obtener detalle de una ubicación única
      description: Retorna la información completa de una sola ubicación (planeta, dimensión o estación) identificado por su ID.
      parameters:
        - $ref: '#/components/parameters/id.parameter'
      responses:
        '200':
          description: Ubicación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /episode:
    get:
      tags:
        - Episodios
      summary: Obtener lista de episodios
      description: Retorna una lista paginada de todos los episodios emitidos.
      parameters:
        - $ref: '#/components/parameters/page.parameter'
      responses:
        '200':
          description: Listado de episodios obtenido con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
  /episode/{id}:
    get:
      tags:
        - Episodios
      summary: Obtener detalle de un episodio único
      description: Retorna la información completa de un solo episodio identificado por su ID.
      parameters:
        - $ref: '#/components/parameters/id.parameter'
      responses:
        '200':
          description: Episodio encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Episode'
        '400':
          $ref: '#/components/responses/BadRequest.response'
        '422':
          $ref: '#/components/responses/UnprocessableContent.response'
        '500':
          $ref: '#/components/responses/ServerError.response'
components:
  parameters:
    page.parameter:
      name: page 
      in: query
      description: Número de pagina
      required: true
      schema:
        type: integer
        example: 1
    idCharacter.parameter: 
      name: id
      in: path
      description: ID del personaje
      required: true
      schema:
        type: integer
        example: 2
    id.parameter:
      name: id
      in: path
      description: ID detalle del elemento
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
    query.parameter:
      name: id
      in: query
      description: ID del usuario
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
  schemas:
    uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
      example: 663d5363-ea3b-43f5-be04-3e7ccef942cc
    Fecha:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        timeZone:
          type: string
          description: Zona horaria en formato IANA
          example: America/New_York
        date:
          type: string
          format: date-time
          example: '2024-10-15T18:30:00.000Z'
          description: Fecha en formato ISO 8601 en UTC
    Usuario:
      type: object
      required:
        - fullName
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        fullName:
          type: string
          description: Nombre completo.
          example: 'Hal Finney'
        jobArea:
          type: string
          description: Departamento de trabajo.
          example: 'Cypherpunk'
        email:
          type: string
          format: email
          description: Correo electronico.
          example: 'Hal-Finney@yahoo.com'
        isBlock:
          type: boolean
    CharacterPaginatedResponse:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/PaginationInfo'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Character'
    PaginationInfo:
      type: object
      properties:
        count:
          type: integer
          description: Cantidad total de registros
          example: 826
        pages:
          type: integer
          description: Cantidad total de páginas
          example: 42
        next:
          type: string
          format: uri
          nullable: true
          description: URL de la siguiente página
          example: "https://rickandmortyapi.com/api/character?page=2"
        prev:
          type: string
          format: uri
          nullable: true
          description: URL de la página anterior
          example: null
    PaginationLocationInfo:
      type: object
      properties:
        count:
          type: integer
          example: 126
        pages:
          type: integer
          example: 7
        next:
          type: string
          format: uri
          nullable: true
          example: "https://rickandmortyapi.com/api/location?page=2"
        prev:
          type: string
          format: uri
          nullable: true
          example: null
    Character:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Rick Sanchez"
        estado:
          type: string
          enum: [Alive, Dead, unknown]
          example: "Alive"
        especie:
          type: string
          example: "Human"
        genero:
          type: string
          enum: [Female, Male, Genderless, unknown]
          example: "Male"
        origen:
          $ref: '#/components/schemas/LocationRef'
        foto:
          type: string
          format: uri
          example: "https://rickandmortyapi.com/api/character/avatar/1.jpeg"
        episodios:
          type: array
          items:
            type: string
          example: ["1"]
        fechaCreacion:
          type: string
          format: date-time
          example: "2017-11-04T18:48:46.250Z"
    LocationRef:
      type: object
      properties:
        name:
          type: string
          example: "Earth (C-137)"
        url:
          type: string
          format: uri
          example: "https://rickandmortyapi.com/api/location/1"
    LocationPaginatedResponse:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/PaginationLocationInfo'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    Location:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Earth (C-137)"
        type:
          type: string
          description: "El tipo de ubicación (Planet, Cluster, Space station, etc.)"
          example: "Planet"
        dimension:
          type: string
          description: "La dimensión a la que pertenece la ubicación"
          example: "Dimension C-137"
        residents:
          type: array
          description: "Lista de personajes que residen en esta ubicación"
          items:
            type: string
            format: uri
          example: ["https://rickandmortyapi.com/api/character/38"]
        url:
          type: string
          format: uri
          example: "https://rickandmortyapi.com/api/location/1"
        created:
          type: string
          format: date-time
          example: "2017-11-10T12:42:04.162Z"
    EpisodePaginatedResponse:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/PaginationEpisoeInfo'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
    PaginationEpisoeInfo:
      type: object
      properties:
        count:
          type: integer
          example: 51
        pages:
          type: integer
          example: 3
        next:
          type: string
          format: uri
          nullable: true
          example: "https://rickandmortyapi.com/api/episode?page=2"
        prev:
          type: string
          format: uri
          nullable: true
          example: null
    Episode:
      type: object
      properties:
        id:
          type: integer
          description: ID único del episodio.
          example: 1
        name:
          type: string
          description: Nombre del episodio.
          example: "Pilot"
        air_date:
          type: string
          description: Fecha en la que el episodio salió al aire.
          example: "December 2, 2013"
        episode:
          type: string
          description: Código del episodio (Temporada y Número).
          example: "S01E01"
        characters:
          type: array
          description: Lista de personajes que aparecen en este episodio.
          items:
            type: string
            format: uri
          example: ["https://rickandmortyapi.com/api/character/1"]
        url:
          type: string
          format: uri
          description: Enlace al endpoint del propio episodio.
          example: "https://rickandmortyapi.com/api/episode/1"
        created:
          type: string
          format: date-time
          description: Fecha de creación del registro en la base de datos.
          example: "2017-11-10T12:56:33.798Z"
    ErrorModel:
      type: object
      properties:
        code:
          type: string
          description: Código
        message:
          type: string
          description: Resumen del código
        description:
          type: string
          description: Descripción del código
      required:
        - code
        - message
        - description
  requestBodies:
    CrearUsuario:
      description: Datos para la creación de un usuario
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Usuario'
            - type: object
              properties:
                id:
                  readOnly: true
                fullName:
                  writeOnly: true
                jobArea:
                  writeOnly: true
                email:
                  writeOnly: true
                isBlock:
                  readOnly: true
              required:
              - fullName
              - jobArea
              - email
      required: true
    ActualizarUsuario:
      description: Request body para la actualización de una porción del usuario
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Usuario'
            - type: object
              properties:
                id:
                  readOnly: true
                isBlock:
                  readOnly: true
      required: true
    CrearFecha:
      description: Crea un colección de fechas con campos `timeZone` (IANA) y `fecha` (ISO 8601) y devuelve la colección de fechas con su identificador único.
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/Fecha'
              - type: object
                properties:
                  id:
                    readOnly: true
              required:
                - timeZone
                - date
          example:
            - timeZone: "America/Mexico_City"
              date: "2024-10-15T12:30:00-06:00"
            - timeZone: "Europe/London"
              date: "2024-10-15T19:30:00+01:00"
            - timeZone: "Asia/Tokyo"
              date: "2024-10-16T03:30:00+09:00"
      required: true
  responses:
    Usuario.response:
      description: Usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Usuario'
    Usuarios.response:
      description: Lista de usuarios
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
    CrearUsuario.response:
      description: Usuario creado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Usuario'
    ActualizarUsuario.response:
      description: Usuario actualizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Usuario'
    EliminarUsuario.response:
      description: Usuario eliminado
      content:
        application/json:
          schema:
            properties:
              id:
                $ref: '#/components/schemas/uuid'
    CrearFecha.response:
      description: Lista de fechas creadas
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Fecha'
          example:
            - id: "8dbeb7e3-407d-46b5-9bbc-97562314bb49"
              timeZone: "America/Mexico_City"
              date: "2024-10-15T18:30:00.000Z"
            - id: "3ef98f4d-0e07-4793-bc53-543aa19d20ee"
              timeZone: "Europe/London"
              date: "2024-10-15T18:30:00.000Z"
            - id: "afcf5670-c33f-4b1a-9be6-6a4b3eb27246"
              timeZone: "Asia/Tokyo"
              date: "2024-10-15T18:30:00.000Z"
    BadRequest.response:
      description: La solicitud presenta una sintaxis de incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            code: '400'
            message: 'Bad Request'
            description: 'Malformed request syntax'
    NotFound.response:
      description: La solicitud no obtuvo resultados en el servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            code: '404'
            message: 'Not found'
            description: 'Requested resource not found'
    Conflict.response:
      description: La solicitud presenta conflictos en el estado del modelo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            code: '409'
            message: 'Conflict'
            description: 'Trying to add a resource that already exists'
    UnprocessableContent.response:
      description: La solicitud presenta conflictos con alguna regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            code: '422'
            message: 'Unprocessable Content'
            description: 'Business logic or Authorization errors'
    ServerError.response:
      description: El servidor encontró una condición inesperada que le impidió cumplir con la solicitud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            code: '500'
            message: 'Internal Server Error'
            description: 'Server encountered an unexpected condition'
    # note! Response is used for all HTTP codes that are not covered individually
    Default.response:
      description: Error inesperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
