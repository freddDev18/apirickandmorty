# Seguridad con las plantillas de seguridad
# include:
#   - template: Security/SAST.gitlab-ci.yml
#   - template: Security/Container-Scanning.gitlab-ci.yml
#   - template: Security/Dependency-Scanning.gitlab-ci.yml
variables:
  # Docker config
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  
  # Registry config
  HARBOR_REGISTRY: harbor-utict.patronato.unam.mx
  HARBOR_PROJECT: backend-app
  HARBOR_USERNAME: desarrollo
  IMAGE_NAME: api
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  FULL_IMAGE_NAME: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}
  
  # Deployment config
  SSH_USER: desarrollo
  SSH_HOST: spdocker-desa-24.patronato.unam.mx
  SSH_PORT: "22"
  SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  REMOTE_PATH: /opt/docker/${HARBOR_PROJECT}

  # Database config (para tests)
  DB_HOST_TEST: db-e2e
  DB_PORT_TEST: "3306"
  DB_NAME_TEST: mysqldb_test
  DB_USER_TEST: admin
  DB_PASSWORD_TEST: qwerty123

  # Node config
  NODE_VERSION: "23"

# Al inicio del archivo, agrega workflow global
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop" 
    - if: $CI_MERGE_REQUEST_ID

image: node:23
stages:
  - install
  - test
  - build
  - deploy

# Agregar caché global y políticas
default:
  tags:
    - utict
  cache:
    - key: 
        files:
          - package-lock.json
      paths:
        - node_modules/
      policy: pull-push
    - key: npm-cache
      paths:
        - .npm/
      policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

install-dependencies:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm config set cache .npm --global
    - npm config set prefer-offline true
  script:
    - npm ci --only=production --no-audit
    - npm ci --only=development --no-audit
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules/
  cache:
    key: 
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push

lint:
  stage: test
  script:
    - npm run lint
  dependencies:
    - install-dependencies
  # Sin rules - debe ejecutarse siempre en test

e2e-tests:
  stage: test
  image: node:23
  tags:
    - utict
  services:
    - name: mysql:8
      alias: db-e2e
  variables:
    # Database configuration for e2e tests
    MYSQL_DATABASE: mysqldb_test
    MYSQL_USER: admin
    MYSQL_PASSWORD: qwerty123
    MYSQL_ROOT_PASSWORD: root
    # Application environment variables
    NODE_ENV: e2e
    DB_HOST_APP: db-e2e
    DB_PORT_APP: 3306
    DB_NAME_APP: mysqldb_test
    DB_USER_APP: admin
    DB_PASSWORD_APP: qwerty123
  script:
    - npm run e2e:coverage
  dependencies:
    - install-dependencies
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - "src/**/*"
        - "test/**/*"
        - "package*.json"
        - "*.yml"


build-app:
  stage: build
  image: docker:latest
  tags:
    - utict
  services:
    - docker:dind
  before_script:
    - echo "Attempting login to $HARBOR_REGISTRY..."
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_REGISTRY
  script:
    # Build con múltiples tags
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        -t $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG \
        -t $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest \
        .
    - docker push $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG
    - docker push $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest
  dependencies:
    - e2e-tests
    - lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # NO en merge requests - solo en ramas principales

deploy-qa:
  stage: deploy
  image: alpine:latest
  tags:
    - utict
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    # Verificar que ENV_FILE existe y crear .env
    - echo "Checking ENV_FILE variable..."
    - |
      if [ -z "$ENV_FILE" ] || [ ! -f "$ENV_FILE" ]; then
        echo "ERROR: ENV_FILE variable is not set or file doesn't exist"
        echo "Please configure ENV_FILE as a File type variable in GitLab CI/CD settings"
        exit 1
      fi
    - cp "$ENV_FILE" .env
    - echo "✓ .env file created successfully"
  script:
    # Crear el directorio remoto si no existe
    - echo "Creating remote directory structure..."
    - sshpass -p "$SSH_PASSWORD" ssh -tt -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$SSH_HOST "echo '$SSH_PASSWORD' | sudo -S mkdir -p $REMOTE_PATH && echo '$SSH_PASSWORD' | sudo -S chown $SSH_USER:$SSH_USER $REMOTE_PATH"
    - sshpass -p "$SSH_PASSWORD" ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$SSH_HOST "ls -la $REMOTE_PATH"

    # Copia archivos necesarios al servidor remoto
    - echo "Copying files to remote server..."
    - |
      sshpass -p "$SSH_PASSWORD" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
        compose.yml .env $SSH_USER@$SSH_HOST:$REMOTE_PATH/

    # Ejecuta comandos en el servidor remoto con las variables necesarias
    - echo "Executing deployment commands..."
    - |
      sshpass -p "$SSH_PASSWORD" ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$SSH_HOST "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        echo 'Using image: $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        docker compose pull &&
        docker compose up -d&&
        docker compose ps
      "
  dependencies:
    - build-app
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual  # Deploy manual en develop
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Deploy manual en main también

cleanup_runner:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  tags:
    - utict
  script:
    - echo "Cleaning up Docker images older than 7 days..."
    # Limpiar imágenes no utilizadas
    - docker image prune -a --filter "until=168h" --force
    # Limpiar contenedores parados
    - docker container prune --force
    # Limpiar volúmenes huérfanos
    - docker volume prune --force
    # Mostrar espacio liberado
    - docker system df
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual  # Deploy manual en develop
  allow_failure: true

cleanup_server:
  stage: deploy
  image: alpine:latest
  tags:
    - utict

  before_script:
    - apk add --no-cache openssh-client sshpass
  script:
    - echo "Cleaning up Docker images on deployment server..."
    - |
      sshpass -p "$SSH_PASSWORD" ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
        echo 'Current Docker usage:' &&
        docker system df &&
        echo 'Cleaning old images...' &&
        docker image prune -a --filter 'until=168h' --force &&
        docker container prune --force &&
        docker volume prune --force &&
        echo 'Cleanup completed. New usage:' &&
        docker system df
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual  # Deploy manual en develop
  allow_failure: true