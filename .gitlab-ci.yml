# Seguridad con las plantillas de seguridad
# include:
#   - template: Security/SAST.gitlab-ci.yml
#   - template: Security/Container-Scanning.gitlab-ci.yml
#   - template: Security/Dependency-Scanning.gitlab-ci.yml
variables:
  # Docker config
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  
  # Registry config
  HARBOR_REGISTRY: harbor-utict.patronato.unam.mx
  HARBOR_PROJECT: ${CI_PROJECT_NAME}
  HARBOR_USERNAME: desarrollo
  IMAGE_NAME: be
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  FULL_IMAGE_NAME: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}
  
  # Deployment config
  SSH_USER_QA: desarrollo
  SSH_HOST_QA: spdocker-desa-24.patronato.unam.mx
  SSH_PORT_QA: "22"
 
  # Delivery config
  SSH_HOST_PROD: spdocker-pro.patronato.unam.mx
  SSH_PORT_PROD: "22"

  # SSH options
  SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  REMOTE_PATH: /opt/docker/${HARBOR_PROJECT}-${IMAGE_NAME}

  # Database config (para tests)
  DB_HOST_TEST: db-e2e
  DB_PORT_TEST: "3306"
  DB_NAME_TEST: mysqldb_test
  DB_USER_TEST: admin
  DB_PASSWORD_TEST: qwerty123

  # Node config
  NODE_VERSION: "23"

# Al inicio del archivo, agrega workflow global
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop" 
    - if: $CI_MERGE_REQUEST_ID

image: node:${NODE_VERSION}-alpine
stages:
  - install
  - test
  - build
  - deploy
  - post-deploy
  - delivery

# Agregar caché global y políticas
default:
  tags:
    - utict
  cache:
    - key: 
        files:
          - package-lock.json
      paths:
        - node_modules/
      policy: pull-push
    - key: npm-cache
      paths:
        - .npm/
      policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

install-dependencies:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm config set cache .npm --global
    - npm config set prefer-offline true
  script:
     - npm ci --no-audit
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules/
  cache:
    key: 
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push

lint:
  stage: test
  script:
    - npm run lint
  dependencies:
    - install-dependencies
  # Sin rules - debe ejecutarse siempre en test

e2e-tests:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - name: mysql:8
      alias: db-e2e
  variables:
    # Database configuration for e2e tests
    MYSQL_DATABASE: ${DB_NAME_TEST}
    MYSQL_USER: ${DB_USER_TEST}
    MYSQL_PASSWORD: ${DB_PASSWORD_TEST}
    MYSQL_ROOT_PASSWORD: root
    # Application environment variables
    NODE_ENV: e2e
    DB_HOST_APP: ${DB_HOST_TEST}
    DB_PORT_APP: ${DB_PORT_TEST}
    DB_NAME_APP: ${DB_NAME_TEST}
    DB_USER_APP: ${DB_USER_TEST}
    DB_PASSWORD_APP: ${DB_PASSWORD_TEST}
  script:
    - npm run e2e:coverage
  dependencies:
    - install-dependencies
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - "src/**/*"
        - "test/**/*"
        - "package*.json"
        - "*.yml"
        - "Dockerfile"

build-app:
  stage: build
  image: docker:24.0
  before_script:
    - apk add --no-cache curl jq
    - echo "Checking if Harbor project exists or creating it..."
    - |
      # Check if project exists
      PROJECT_EXISTS=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_PROJECT" | jq -e ".[] | select(.name == \"$HARBOR_PROJECT\")" > /dev/null && echo 1 || echo 0)

      # If project doesn't exist, create it
      if [ "$PROJECT_EXISTS" -eq "0" ]; then
        echo "Creating Harbor project '$HARBOR_PROJECT'..."
        curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X POST "https://$HARBOR_REGISTRY/api/v2.0/projects" \
          -H "Content-Type: application/json" \
          -d "{\"project_name\": \"$HARBOR_PROJECT\", \"public\": false}" \
          -o /dev/null
        
        # Check if project was created successfully
        PROJECT_CREATED=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_PROJECT" | jq -e ".[] | select(.name == \"$HARBOR_PROJECT\")" > /dev/null && echo 1 || echo 0)
        if [ "$PROJECT_CREATED" -eq "0" ]; then
          echo "Failed to create Harbor project '$HARBOR_PROJECT'"
          exit 1
        else
          echo "✓ Harbor project '$HARBOR_PROJECT' created successfully"
        fi
      else
        echo "✓ Harbor project '$HARBOR_PROJECT' already exists"
      fi
    - echo "Logging into Harbor registry..."
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_REGISTRY
  script:
    - echo "Building image ${FULL_IMAGE_NAME}:${IMAGE_TAG}"
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        --cache-from ${FULL_IMAGE_NAME}:latest \
        -t ${FULL_IMAGE_NAME}:${IMAGE_TAG} \
        -t ${FULL_IMAGE_NAME}:latest \
        -t ${FULL_IMAGE_NAME}:${CI_COMMIT_REF_SLUG} \
        .
    - docker push ${FULL_IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${FULL_IMAGE_NAME}:latest
    - docker push ${FULL_IMAGE_NAME}:${CI_COMMIT_REF_SLUG}
  after_script:
    - docker logout $HARBOR_REGISTRY
  dependencies:
    - e2e-tests
    - lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # NO en merge requests - solo en ramas principales

.deploy_template: &deploy_template
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    - |
      if [ -z "$ENV_FILE_QA" ] || [ ! -f "$ENV_FILE_QA" ]; then
        echo "ERROR: ENV_FILE_QA variable is not set or file doesn't exist"
        exit 1
      fi
    - cp "$ENV_FILE_QA" .env
    - echo "✓ .env file created successfully"

deploy-qa:
  <<: *deploy_template
  stage: deploy
  environment:
    name: qa
    url: http://${HARBOR_PROJECT}-${IMAGE_NAME}.${SSH_HOST_QA}
    on_stop: stop_qa
  script:
    - echo "Deploying to QA environment..."
    - echo "Creating remote directory structure..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -tt -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA \
        "echo '$SSH_PASSWORD_QA' | sudo -S mkdir -p $REMOTE_PATH && \
         echo '$SSH_PASSWORD_QA' | sudo -S chown $SSH_USER_QA:$SSH_USER_QA $REMOTE_PATH"
    
    - echo "Copying deployment files..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT_QA $SSH_OPTIONS" \
        compose.yml .env $SSH_USER_QA@$SSH_HOST_QA:$REMOTE_PATH/
    
    - echo "Executing deployment..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Deploying image: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        docker compose pull &&
        docker compose up -d --build --remove-orphans &&
        docker compose ps
      "
  dependencies:
    - build-app
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

.cleanup_template: &cleanup_template
  stage: post-deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  allow_failure: true

cleanup:docker:
  <<: *cleanup_template
  image: docker:24.0
  parallel:
    matrix:
      - TARGET: ["runner", "server"]
  script:
    - |
      if [ "$TARGET" == "runner" ]; then
        echo "Cleaning up local Docker resources..."
        docker image prune -a --force
        docker container prune --force
        docker volume prune --force
        docker system df
      else
        echo "Cleaning up remote Docker resources..."
        apk add --no-cache openssh-client sshpass
        sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
          docker image prune -a --force &&
          docker container prune --force &&
          docker volume prune --force &&
          docker system df
        "
      fi

stop_qa:
  stage: post-deploy
  environment:
    name: qa
    action: stop
  script:
    - apk add --no-cache openssh-client sshpass
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        docker compose down
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

.delivery_template: &delivery_template
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    - |
      if [ -z "$ENV_FILE_PROD" ] || [ ! -f "$ENV_FILE_PROD" ]; then
        echo "ERROR: ENV_FILE_PROD variable is not set or file doesn't exist"
        exit 1
      fi
    - cp "$ENV_FILE_PROD" .env
    - echo "✓ .env file created successfully"

delivery-production:
  <<: *delivery_template
  stage: delivery
  environment:
    name: production
    url: http://${HARBOR_PROJECT}-${IMAGE_NAME}.${SSH_HOST_PROD}
    on_stop: stop_production
  script:
    - echo "Deploying to Production environment..."
    - echo "Creating remote directory structure..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -tt -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD \
        "echo '$SSH_PASSWORD_PROD' | sudo -S mkdir -p $REMOTE_PATH && \
         echo '$SSH_PASSWORD_PROD' | sudo -S chown $SSH_USER_PROD:$SSH_USER_PROD $REMOTE_PATH"
    
    - echo "Copying deployment files..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT_PROD $SSH_OPTIONS" \
        compose.yml .env $SSH_USER_PROD@$SSH_HOST_PROD:$REMOTE_PATH/
    
    - echo "Executing delivery..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Deploying image: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        docker compose pull &&
        docker compose up -d --build --remove-orphans &&
        docker compose ps
      "
  dependencies:
    - deploy-qa
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual  # Deploy manual en develop
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Deploy manual en main también

stop_production:
  stage: delivery
  environment:
    name: production
    action: stop
  script:
    - apk add --no-cache openssh-client sshpass
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        docker compose down
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual