include:
  - local: "templates/main.gitlab-ci.yml"
# Descomentar si se desea limpieza de Docker y cacheo de imágenes base
  - local: "templates/cleanup-docker.gitlab-ci.yml"
  - local: "templates/cache-base-images.gitlab-ci.yml"
# Seguridad (deshabilitado por ahora, activar si se requiere)
  # - template: Security/SAST.gitlab-ci.yml
  # - template: Security/Container-Scanning.gitlab-ci.yml
  # - template: Security/Dependency-Scanning.gitlab-ci.yml
# -------------------------------------------------------------
# Jobs de pruebas
# -------------------------------------------------------------
e2e-tests:
  stage: test
  services:
    - name: ${MYSQL_IMAGE}
      alias: db-e2e
      variables:
        MYSQL_ROOT_PASSWORD: mys3cretp4SS
        MYSQL_DATABASE: mydatabase
        MYSQL_USER: mydbuser
        MYSQL_PASSWORD: mys3cretp4SS
  variables:
    # Database
    DB_HOST_APP: db-e2e
    DB_PORT_APP: 3306
    DB_NAME_APP: mydatabase
    DB_USER_APP: mydbuser
    DB_PASSWORD_APP: mys3cretp4SS

  before_script:
    - apk add --no-cache git
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - npm config set cache .npm --global
    # Si no existe node_modules o falta vitest, instalar (aprovecha cache)
    - |
      if [ ! -d node_modules ] || [ ! -x node_modules/.bin/vitest ]; then
        echo "node_modules missing or vitest absent — running npm ci"
        npm ci --no-audit --prefer-offline
      else
        echo "node_modules present, skipping npm ci"
      fi
    # Función para esperar servicios
    - |
      wait_for_service() {
        local service_name="$1"
        local host="$2"
        local port="$3"
        shift 3
        local check_cmd="$@"
        
        echo "Esperando $service_name en $host:$port..."
        for i in $(seq 1 15); do
          if $check_cmd >/dev/null 2>&1; then
            echo "✓ $service_name está listo"
            return 0
          fi
          echo "Esperando $service_name... intento $i/15"
          sleep 2
        done
        echo "⚠ Timeout esperando $service_name"
        return 1
      }
    # Espera inicial para reducir flakiness
    - sleep 5
    # Verificar servicios
    - wait_for_service "MySQL" "$DB_HOST_APP" "$DB_PORT_APP" nc -z -w5 "$DB_HOST_APP" "$DB_PORT_APP"
  script:
    - npm run e2e:coverage
  artifacts:
    when: always
    name: "coverage-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expose_as: "Coverage HTML"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/lcov-report/index.html
      - coverage/lcov-report/
      - coverage/cobertura-coverage.xml
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - "src/**/*"
        - "e2e/**/*"
        - "test/**/*"
        - "package*.json"
        - "*.yml"
        - "Dockerfile"