# Seguridad con las plantillas de seguridad
# include:
#   - template: Security/SAST.gitlab-ci.yml
#   - template: Security/Container-Scanning.gitlab-ci.yml
#   - template: Security/Dependency-Scanning.gitlab-ci.yml
variables:

  # Versions
  NODE_VERSION: "24"
  ALPINE_VERSION: "3.22"
  DOCKER_VERSION: "24.0"
  MYSQL_VERSION: "8"

  # Docker config (para jobs que usan Docker)
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""

  # Server Registry config
  HARBOR_REGISTRY: harbor-utict.patronato.unam.mx
  HARBOR_PROJECT: ${CI_PROJECT_NAME}
  HARBOR_IMAGES_PUBLIC: base-images
  HARBOR_USERNAME: desarrollo
  IMAGE_NAME: be
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  FULL_IMAGE_NAME: ${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}
  
  # Usar Harbor como proxy para imágenes públicas
  NODE_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/node:${NODE_VERSION}-alpine
  ALPINE_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/alpine:${ALPINE_VERSION}
  DOCKER_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/docker:${DOCKER_VERSION}
  MYSQL_IMAGE: ${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/mysql:${MYSQL_VERSION}

  # Server Deployment config
  SSH_USER_QA: desarrollo
  SSH_HOST_QA: spdocker-desa-24.patronato.unam.mx
  SSH_PORT_QA: "22"
 
  # Server Delivery config
  SSH_HOST_PROD: spdocker-pro.patronato.unam.mx
  SSH_PORT_PROD: "22"

  # SSH options
  SSH_OPTIONS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  REMOTE_PATH: /opt/docker/${HARBOR_PROJECT}-${IMAGE_NAME}

  # Database config (para tests)
  DB_HOST_TEST: db-e2e
  DB_PORT_TEST: "3306"
  DB_NAME_TEST: mysqldb_test
  DB_USER_TEST: admin
  DB_PASSWORD_TEST: qwerty123


# Al inicio del archivo, agrega workflow global
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop" 
    - if: $CI_MERGE_REQUEST_ID

image: ${NODE_IMAGE}  # ← Imagen global por defecto para jobs sin imagen específica
stages:
  - cache
  - install
  - test
  - build
  - deploy
  - post-deploy
  - delivery

# Agregar caché global y políticas
default:
  tags:
    - utict
  cache:
    - key: 
        files:
          - package-lock.json
      paths:
        - node_modules/
      policy: pull-push
    - key: npm-cache
      paths:
        - .npm/
      policy: pull-push
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.clean_shadow_submodules: &clean_shadow_submodules
  - |  # Limpiar submódulos para evitar problemas con cambios en .gitmodules
    for path in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
      echo "Cleaning submodule $path"
      rm -rf "$path"                         # borra la copia de trabajo
      rm -rf ".git/modules/$path"            # borra metadata interna del submódulo
    done
  - | # si alguna submodule quedó shallow:
    git submodule foreach 'git fetch --all || true; git fetch --unshallow || true'
  - git submodule sync --recursive
  - git submodule update --init --recursive

install-dependencies:
  stage: install
  before_script:
    - apk add --no-cache git
    - *clean_shadow_submodules
    - npm config set cache .npm --global
  script:
     - npm ci --no-audit
  cache:
    key: 
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push

lint:
  stage: test
  script:
    - npm run lint
  dependencies:
    - install-dependencies
  # Sin rules - debe ejecutarse siempre en test

e2e-tests:
  stage: test
  services:
    - name: ${MYSQL_IMAGE}
      alias: db-e2e
  variables:
    # Database configuration for e2e tests
    MYSQL_DATABASE: ${DB_NAME_TEST}
    MYSQL_USER: ${DB_USER_TEST}
    MYSQL_PASSWORD: ${DB_PASSWORD_TEST}
    MYSQL_ROOT_PASSWORD: root
    # Application environment variables
    DB_HOST_APP: ${DB_HOST_TEST}
    DB_PORT_APP: ${DB_PORT_TEST}
    DB_NAME_APP: ${DB_NAME_TEST}
    DB_USER_APP: ${DB_USER_TEST}
    DB_PASSWORD_APP: ${DB_PASSWORD_TEST}
  before_script:
    - apk add --no-cache git
    - npm config set cache .npm --global
    # Si no existe node_modules o falta vitest, instalar (aprovecha cache)
    - |
      if [ ! -d node_modules ] || [ ! -x node_modules/.bin/vitest ]; then
        echo "node_modules missing or vitest absent — running npm ci"
        npm ci --no-audit --prefer-offline
      else
        echo "node_modules present, skipping npm ci"
      fi
  script:
    - npm run e2e:coverage
  artifacts:
    when: always
    name: "coverage-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expose_as: "Coverage HTML"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/lcov-report/index.html
      - coverage/lcov-report/
      - coverage/cobertura-coverage.xml
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - "src/**/*"
        - "e2e/**/*"
        - "test/**/*"
        - "package*.json"
        - "*.yml"
        - "Dockerfile"

build-app:
  stage: build
  image: ${DOCKER_IMAGE}
  before_script:
    - apk add --no-cache curl jq
    - |    
      if [ -z "$HARBOR_PASSWORD" ]; then
        echo "ERROR: HARBOR_PASSWORD variable is not set"
        exit 1
      fi
    - echo "Checking if Harbor project exists or creating it..."
    - |
      # Check if project exists
      PROJECT_EXISTS=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_PROJECT" | jq -e ".[] | select(.name == \"$HARBOR_PROJECT\")" > /dev/null && echo 1 || echo 0)

      # If project doesn't exist, create it
      if [ "$PROJECT_EXISTS" -eq "0" ]; then
        echo "Creating Harbor project '$HARBOR_PROJECT'..."
        curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X POST "https://$HARBOR_REGISTRY/api/v2.0/projects" \
          -H "Content-Type: application/json" \
          -d "{\"project_name\": \"$HARBOR_PROJECT\", \"public\": false}" \
          -o /dev/null
        
        # Check if project was created successfully
        PROJECT_CREATED=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_PROJECT" | jq -e ".[] | select(.name == \"$HARBOR_PROJECT\")" > /dev/null && echo 1 || echo 0)
        if [ "$PROJECT_CREATED" -eq "0" ]; then
          echo "Failed to create Harbor project '$HARBOR_PROJECT'"
          exit 1
        else
          echo "✓ Harbor project '$HARBOR_PROJECT' created successfully"
        fi
      else
        echo "✓ Harbor project '$HARBOR_PROJECT' already exists"
      fi
  script:
    - echo "Logging into Harbor registry..."
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_REGISTRY
    - echo "Building image ${FULL_IMAGE_NAME}:${IMAGE_TAG}"
    - |
      docker build \
        --build-arg NODE_VERSION=${NODE_VERSION} \
        --build-arg HARBOR_REGISTRY=${HARBOR_REGISTRY} \
        --build-arg HARBOR_IMAGES_PUBLIC=${HARBOR_IMAGES_PUBLIC} \
        --build-arg ALPINE_VERSION=${ALPINE_VERSION} \
        --cache-from ${FULL_IMAGE_NAME}:latest \
        -t ${FULL_IMAGE_NAME}:${IMAGE_TAG} \
        -t ${FULL_IMAGE_NAME}:latest \
        .
    - docker push ${FULL_IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${FULL_IMAGE_NAME}:latest
  after_script:
    - docker logout $HARBOR_REGISTRY || true
    - docker system prune -f || true
  dependencies:
    - e2e-tests
    - lint
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # NO en merge requests - solo en ramas principales

.check_vars_deploy_template: &check_vars_deploy_template
  - |
    # Verificar variables de entorno requeridas
    if [ -z "$ENV_FILE_QA" ] || [ ! -f "$ENV_FILE_QA" ]; then
      echo "ERROR: ENV_FILE_QA variable is not set or file doesn't exist"
      exit 1
    fi

    if [ -z "$HARBOR_PASSWORD" ]; then
      echo "ERROR: HARBOR_PASSWORD variable is not set"
      exit 1
    fi

    if [ -z "$SSH_PASSWORD_QA" ]; then
      echo "ERROR: SSH_PASSWORD_QA variable is not set"
      exit 1
    fi

deploy-qa:
  stage: deploy
  image: ${ALPINE_IMAGE}
  environment:
    name: qa
    url: http://${HARBOR_PROJECT}-${IMAGE_NAME}.${SSH_HOST_QA}
    on_stop: stop_qa
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    - *check_vars_deploy_template
    - cp "$ENV_FILE_QA" .env
    - echo "✓ .env file created successfully"
    - echo "Creating remote directory structure..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -tt -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA \
        "echo '$SSH_PASSWORD_QA' | sudo -S mkdir -p $REMOTE_PATH && \
        echo '$SSH_PASSWORD_QA' | sudo -S chown $SSH_USER_QA:$SSH_USER_QA $REMOTE_PATH"
  script:
    - echo "Deploying to QA environment..."    
    - echo "Copying deployment files..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT_QA $SSH_OPTIONS" \
        compose.yml .env $SSH_USER_QA@$SSH_HOST_QA:$REMOTE_PATH/   
    - echo "Executing deployment..."
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Deploying image: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        docker compose pull &&
        docker compose up -d --build --remove-orphans &&
        docker compose ps
      "
  dependencies:
    - build-app
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

stop_qa:
  stage: deploy
  image: ${ALPINE_IMAGE}
  environment:
    name: qa
    action: stop
  needs:
    - job: deploy-qa
      artifacts: false
  before_script:
    - apk add --no-cache openssh-client sshpass
    - .check_vars_deploy_template
  script:
    - |
      sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Stopping container: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        docker compose down
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      
cleanup:docker:
  stage: post-deploy
  image: ${DOCKER_IMAGE}
  needs:
    - job: deploy-qa
      artifacts: false
  parallel:
    matrix:
      - TARGET: ["runner", "server"]
  before_script:
    - .exists_var_ssh_password_qa
  script:
    - |
      if [ "$TARGET" == "runner" ]; then
        echo "Cleaning up local Docker resources..."
        docker image prune -a --force
        docker container prune --force
        docker volume prune --force
        docker system df
      else
        echo "Cleaning up remote Docker resources..."
        apk add --no-cache openssh-client sshpass
        sshpass -p "$SSH_PASSWORD_QA" ssh -p $SSH_PORT_QA $SSH_OPTIONS $SSH_USER_QA@$SSH_HOST_QA "
          docker image prune -a --force &&
          docker container prune --force &&
          docker volume prune --force &&
          docker system df
        "
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

.check_vars_delivery_template: &check_vars_delivery_template
  - |
    # Verificar variables de entorno requeridas
    if [ -z "$ENV_FILE_PROD" ] || [ ! -f "$ENV_FILE_PROD" ]; then
      echo "ERROR: ENV_FILE_PROD variable is not set or file doesn't exist"
      exit 1
    fi
    
    if [ -z "$SSH_USER_PROD" ]; then
      echo "ERROR: SSH_USER_PROD variable is not set"
      exit 1
    fi
    
    if [ -z "$SSH_PASSWORD_PROD" ]; then
      echo "ERROR: SSH_PASSWORD_PROD variable is not set"
      exit 1
    fi
  
delivery-production:
  stage: delivery
  image: ${ALPINE_IMAGE}
  environment:
    name: production
    url: http://${HARBOR_PROJECT}-${IMAGE_NAME}.${SSH_HOST_PROD}
    on_stop: stop_production
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
    - *check_vars_delivery_template
    - cp "$ENV_FILE_PROD" .env
    - echo "✓ .env file created successfully"
  script:
    - echo "Deploying to Production environment..."
    - echo "Creating remote directory structure..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -tt -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD \
        "echo '$SSH_PASSWORD_PROD' | sudo -S mkdir -p $REMOTE_PATH && \
         echo '$SSH_PASSWORD_PROD' | sudo -S chown $SSH_USER_PROD:$SSH_USER_PROD $REMOTE_PATH"
    
    - echo "Copying deployment files..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" rsync -avz --timeout=60 \
        -e "ssh -p $SSH_PORT_PROD $SSH_OPTIONS" \
        compose.yml .env $SSH_USER_PROD@$SSH_HOST_PROD:$REMOTE_PATH/
    
    - echo "Executing delivery..."
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Deploying image: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        docker compose pull &&
        docker compose up -d --build --remove-orphans &&
        docker compose ps
      "
  needs:
    - job: deploy-qa
      artifacts: false 
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual  # Deploy manual en develop
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Deploy manual en main también

stop_production:
  stage: delivery
  image: ${ALPINE_IMAGE}
  environment:
    name: production
    action: stop
  needs:
    - job: delivery-production
      artifacts: false
  before_script:
    - *check_vars_delivery_template
    - apk add --no-cache openssh-client sshpass
  script:
    - |
      sshpass -p "$SSH_PASSWORD_PROD" ssh -p $SSH_PORT_PROD $SSH_OPTIONS $SSH_USER_PROD@$SSH_HOST_PROD "
        cd $REMOTE_PATH &&
        export HARBOR_REGISTRY='$HARBOR_REGISTRY' &&
        export HARBOR_PROJECT='$HARBOR_PROJECT' &&
        export IMAGE_NAME='$IMAGE_NAME' &&
        export IMAGE_TAG='$IMAGE_TAG' &&
        export CI_PROJECT_NAME='$CI_PROJECT_NAME' &&
        echo 'Stopping container: ${FULL_IMAGE_NAME}:${IMAGE_TAG}' &&
        echo '$HARBOR_PASSWORD' | docker login -u '$HARBOR_USERNAME' --password-stdin $HARBOR_REGISTRY &&
        docker compose down
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# Job para cachear imágenes base en Harbor
cache-base-images:
  stage: cache
  image: docker:24.0
  variables:
    # Lista de imágenes base que usamos en el pipeline
    BASE_IMAGES: |
      node:${NODE_VERSION}-alpine
      alpine:${ALPINE_VERSION}
      docker:${DOCKER_VERSION}
      mysql:${MYSQL_VERSION}
  before_script:
    - apk add --no-cache curl jq
    - |
      # Login a Harbor
      if [ ! -z "$HARBOR_USERNAME" ] && [ ! -z "$HARBOR_PASSWORD" ]; then
          echo "Authenticating with Harbor registry..."
          echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_REGISTRY
      elif [ -z "$HARBOR_USERNAME" ] || [ -z "$HARBOR_PASSWORD" ]; then
          echo "WARNING: HARBOR_USERNAME or HARBOR_PASSWORD is not set. Skipping Harbor authentication."
      fi
      
      # Crear proyecto base-images si no existe
      echo "Checking if Harbor cache project exists or creating it..."
      PROJECT_EXISTS=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_IMAGES_PUBLIC" | jq -e ".[] | select(.name == \"$HARBOR_IMAGES_PUBLIC\")" > /dev/null && echo 1 || echo 0)

      if [ "$PROJECT_EXISTS" -eq "0" ]; then
        echo "Creating Harbor cache project '$HARBOR_IMAGES_PUBLIC'..."
        curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X POST "https://$HARBOR_REGISTRY/api/v2.0/projects" \
          -H "Content-Type: application/json" \
          -d "{\"project_name\": \"$HARBOR_IMAGES_PUBLIC\", \"public\": true}" \
          -o /dev/null
        
        PROJECT_CREATED=$(curl -s -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X GET "https://$HARBOR_REGISTRY/api/v2.0/projects?name=$HARBOR_IMAGES_PUBLIC" | jq -e ".[] | select(.name == \"$HARBOR_IMAGES_PUBLIC\")" > /dev/null && echo 1 || echo 0)
        if [ "$PROJECT_CREATED" -eq "0" ]; then
          echo "Failed to create Harbor cache project '$HARBOR_IMAGES_PUBLIC'"
          exit 1
        else
          echo "✓ Harbor cache project '$HARBOR_IMAGES_PUBLIC' created successfully"
        fi
      else
        echo "✓ Harbor cache project '$HARBOR_IMAGES_PUBLIC' already exists"
      fi
  script:
    - |
      echo "Caching base images to Harbor..."
      echo "$BASE_IMAGES" | while IFS= read -r image; do
        # Omitir líneas vacías
        [ -z "$image" ] && continue
        
        echo "Processing image: $image"
        
        # Construir nombres de imagen
        harbor_image="${HARBOR_REGISTRY}/${HARBOR_IMAGES_PUBLIC}/${image}"
        
        # Verificar si la imagen ya existe en Harbor
        echo "Checking if $harbor_image exists in Harbor..."
        if docker manifest inspect "$harbor_image" >/dev/null 2>&1; then
          echo "✓ Image $harbor_image already exists in Harbor, skipping..."
          continue
        fi
        
        # Descargar imagen de Docker Hub
        echo "Pulling $image from Docker Hub..."
        if docker pull "$image"; then
          echo "✓ Successfully pulled $image"
          
          # Etiquetar para Harbor
          echo "Tagging $image as $harbor_image"
          docker tag "$image" "$harbor_image"
          
          # Subir a Harbor
          echo "Pushing $harbor_image to Harbor..."
          if docker push "$harbor_image"; then
            echo "✓ Successfully pushed $harbor_image to Harbor"
          else
            echo "✗ Failed to push $harbor_image to Harbor"
          fi
          
          # Limpiar imagen local para ahorrar espacio
          docker rmi "$image" "$harbor_image" || true
        else
          echo "✗ Failed to pull $image from Docker Hub"
        fi
        
        echo "---"
      done
  after_script:
    - docker logout $HARBOR_REGISTRY || true
    - docker system prune -f || true
  rules:
    - if: $ENABLE_CACHE_IMAGES == "true" && $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $ENABLE_CACHE_IMAGES == "true" && $CI_COMMIT_BRANCH == "develop"  
      when: manual
    - if: $ENABLE_CACHE_IMAGES == "true" && $CI_MERGE_REQUEST_ID
      when: manual
    - when: never  # ← Oculta completamente si la variable no está definida
  